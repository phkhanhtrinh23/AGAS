[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agas"
version = "0.1.0"
description = "Agentic-empowered Group Shilling Attacks in Recommender Systems"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "AGAS Authors" }
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "openpyxl>=3.1",
  "requests>=2.31",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "openai>=1.12"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
agas = "agas.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
